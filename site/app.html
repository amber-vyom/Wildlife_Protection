<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildlife Rescue - App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<style>
  :root { --green:#2e7d32; --bg:#fbfdf9; --text:#1f2a1f; --muted:#56655a; --line:#d9e6d3; }
  @media (prefers-color-scheme: dark) { :root { --green:#66bb6a; --bg:#101710; --text:#e8f0e6; --muted:#a3b3a6; --line:#2a3b2a; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 20px; height:56px; border-bottom:1px solid var(--line); flex:none; }
  header a { color:var(--muted); text-decoration:none; font-size:.92rem; }
  header a:hover { color:var(--green); }
  .brand { font-weight:700; color:var(--text) !important; font-size:1.05rem !important; }
  .right { display:flex; gap:16px; align-items:center; }
  .wrap { position:relative; flex:1; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); }
  @media (max-width:600px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html">🦉 Wildlife Rescue</a>
  <div class="right">
    <a href="index.html#articles" class="hide-sm">Articles</a>
    <a href="index.html#team" class="hide-sm">Team</a>
    <a id="newtab" href="#" target="_blank" rel="noopener">Open in new tab ↗</a>
  </div>
</header>
<div class="wrap">
  <div class="loading">Loading the app… the first load can take a few seconds.</div>
  <iframe id="frame" title="Wildlife Rescue app" allow="clipboard-write; geolocation"></iframe>
</div>
<script>
  const APP_URL = "https://wildlife-rescue-vit.streamlit.app";
  // Only allow simple in-app paths like /report or /track
  let p = new URLSearchParams(location.search).get("p") || "";
  if (!/^\/[a-z0-9-]*$/.test(p)) p = "";
  document.getElementById("frame").src = APP_URL + p + "?embed=true";
  document.getElementById("newtab").href = APP_URL + p;
</script>
</body>
</html>
